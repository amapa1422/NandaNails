<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#140b10" name="theme-color"/><meta content="NandaNails — escolha seu serviço, a data e reserve seu horário." name="description"/><title>NandaNails | Área da Nanda</title><link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="assets/icons/n-v1/favicon.ico"/><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/n-v1/favicon-32x32.png"/><link rel="icon" type="image/png" sizes="16x16" href="assets/icons/n-v1/favicon-16x16.png"/><link rel="apple-touch-icon" sizes="180x180" href="assets/icons/n-v1/apple-touch-icon.png"/><link rel="manifest" href="assets/icons/n-v1/manifest.webmanifest"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet"/><link rel="stylesheet" href="css/styles.css"/></head><body class="admin-page"><header class="admin-topbar"><a aria-label="NandaNails início" class="brand" href="index.html"><span class="brand-seal brand-logo"><img src="assets/da2a94cbeb8739b9.jpg" alt="Monograma N da NandaNails" /></span><span><strong>NandaNails</strong><small>NAIL DESIGN</small></span></a><nav class="admin-nav"><a href="index.html">Ver site</a><button id="logout" class="tiny-action" hidden>Sair</button></nav></header><main class="admin-wrap"><section id="loginPanel" class="admin-card"><h1>Área da Nanda</h1><form id="loginForm" class="booking-form"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Entrar</button></form></section><p id="adminStatus" role="status" aria-live="polite"></p><div id="workspace" hidden><div class="admin-intro"><h1>Sua agenda</h1><button class="btn soft" id="refresh">Atualizar</button></div><div class="admin-stats" id="stats"></div><nav class="admin-tabs" aria-label="Painel"><button data-tab="agenda" class="active">Agenda</button><button data-tab="services">Serviços</button><button data-tab="hours">Funcionamento</button><button data-tab="blocks">Bloqueios e folgas</button></nav><section id="agenda" class="admin-panel active"><div class="admin-card"><div class="admin-form"><label>Data<input id="agendaDate" type="date" required></label><label>Visualização<select id="agendaView"><option value="day">Dia</option><option value="week">Semana</option><option value="month">Mês</option></select></label><label>Disponibilidade do serviço<select id="slotService"></select></label></div><div class="admin-choices" id="slots"></div></div><div class="admin-list" id="appointments"></div></section><section id="services" class="admin-panel"><div id="serviceForms"></div></section><section id="hours" class="admin-panel"><form id="hoursForm" class="admin-card"><h2>Horários de funcionamento</h2><p class="admin-small">Cada linha é um turno. Para uma pausa, separe manhã e tarde. Dia sem turno fica fechado.</p><div id="hourRows"></div><button type="button" class="btn soft" id="addHours">Adicionar turno</button><button type="submit" class="btn primary">Salvar horários</button></form></section><section id="blocks" class="admin-panel"><form class="admin-card admin-form" id="blockForm"><h2 class="wide">Bloquear período</h2><label>Data inicial<input name="fromDate" type="date" required></label><label>Horário inicial<input name="fromTime" type="time" value="00:00" required></label><label>Data final<input name="toDate" type="date" required></label><label>Horário final<input name="toTime" type="time" value="23:59" required></label><label class="wide">Motivo (opcional)<input name="reason" maxlength="200"></label><button class="btn primary" type="submit">Bloquear</button></form><div id="blockList" class="admin-list"></div></section></div></main><dialog id="rescheduleDialog"><form id="rescheduleForm" class="booking-form"><h2>Remarcar atendimento</h2><input name="id" type="hidden"><label>Data<input name="date" type="date" required></label><label>Horário<input name="time" type="time" step="1800" required></label><p class="admin-small">O valor e a duração contratados serão preservados.</p><button class="btn primary" type="submit">Salvar remarcação</button><button class="btn soft" id="closeReschedule" type="button">Voltar</button></form></dialog><script defer src="js/config.js"></script><script defer src="js/admin.js"></script></body></html>
